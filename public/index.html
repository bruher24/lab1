<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Lab 1</title>

    <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/vendor/jquery/jquery.min.js"></script>
</head>
<body>
<div class="container">
    <h3>Угадывание мифического существа</h3>

        <button id="start-game" class="btn btn-outline-warning">Начать игру</button>

    </div>

    <button id="add-btn"></button>
    <button id="details-btn"></button>
    <button id="showall-btn"></button>

</div>
